name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest + agentcore (the sibling runtime under test)
        run: |
          pip install pytest
          pip install git+https://github.com/lukatkem/agentcore.git
      - name: Run tests
        run: python -m pytest -q
